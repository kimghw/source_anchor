<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SourceAnchor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='none' stroke='%231d5fd1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' d='M12 8v13M12 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5ZM5 13H3a9 9 0 0 0 18 0h-2M9 12h6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="apple.css">
  <link rel="stylesheet" href="explorer.css">
  <link rel="stylesheet" href="ask.css">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v13M12 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5ZM5 13H3a9 9 0 0 0 18 0h-2M9 12h6"/></svg>
      <div class="brand-copy"><strong>SourceAnchor</strong><span>근거로 연결되는 글쓰기</span></div>
    </div>
    <div class="doc-controls" id="doc-controls"></div>
    <div class="book-controls" id="book-controls" hidden></div>
    <div class="book-controls" id="analysis-controls" hidden></div>
    <div class="book-controls" id="form-controls" hidden></div>
    <nav class="summary" id="summary" aria-label="검증 요약"></nav>
    <div class="topbar-actions">
      <span class="save-state" id="save-state" role="status" aria-live="polite"></span>
      <button class="btn ghost" id="btn-undo" title="실행 취소 (Ctrl+Z)" aria-label="실행 취소 (Ctrl+Z)">↶</button>
      <button class="btn ghost" id="btn-redo" title="다시 실행 (Ctrl+Y)" aria-label="다시 실행 (Ctrl+Y)">↷</button>
      <button class="btn ghost" id="btn-export" title="Markdown 파일로 내보내기"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></svg>내보내기</button>
      <button class="btn ghost" id="btn-ratio" type="button" title="지금 열린 열의 가로 너비 비율을 고릅니다 — 열린 열에 맞춘 비율 4가지(모두 열려 있으면 균등 25/25/25/25, 편집기 넓게 15/55/15/15 등)를 제안하고 직접 적을 수도 있습니다. 접힌 열은 접힌 채 둡니다">열 비율 ▾</button>
      <button class="icon-btn capture-btn" id="btn-capture" type="button" title="화면 캡처 — 틀 하나를 누르거나 끌어서 여러 틀을 고르면 보이는 그대로 그림으로 떠서 클립보드에 복사합니다" aria-label="화면 캡처"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6l2-3h4l2 3h4a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z"/><circle cx="12" cy="12" r="4"/></svg></button>
      <span class="topbar-connections" id="topbar-connections"></span>
    </div>
  </header>

  <nav class="panel-nav" id="panel-nav" aria-label="작업 패널 이동">
    <button type="button" data-panel="explorer" aria-pressed="false">탐색</button>
    <button type="button" data-panel="main" aria-pressed="true">작성</button>
    <button type="button" data-panel="chat" aria-pressed="false">에이전트</button>
    <button type="button" data-panel="sources" aria-pressed="false">자료</button>
  </nav>
  <div class="shell">
    <!-- 0열 장 탐색기 — 보고서와 장을 목차 순서·수준대로 보여 주고, 두 화면이 함께 쓴다 (FR-WB-061, 074, 079) -->
    <aside class="col col-explorer" id="explorer" aria-label="장 탐색기"></aside>
    <div class="gutter" data-resize="explorer" data-side="left"></div>

    <main class="workspace" id="workspace">
      <section class="col col-editor" id="col-editor" aria-label="편집기"></section>
      <div class="gutter" data-resize="evidence" hidden></div>
      <aside class="col col-evidence" id="col-evidence" aria-label="작성 근거" hidden></aside>
      <div class="gutter" data-resize="chat"></div>
      <section class="col col-chat" id="col-chat" aria-label="에이전트 채팅"></section>
      <div class="gutter" data-resize="sources"></div>
      <section class="col col-sources" id="col-sources" aria-label="원문"></section>
    </main>

    <!-- 보고서(메인문서) 화면 — 1열 목차·지시문, 2열 에이전트, 3열 작성 기준·원문(기준 문서 + 장별 원문) (FR-WB-071, 075, 085) -->
    <main class="workspace book-workspace" id="book-workspace" hidden>
      <section class="col col-chapters" id="book-chapters" aria-label="목차·지시문"></section>
      <div class="gutter" data-resize="chat"></div>
      <section class="col col-chat" id="book-chat" aria-label="보고서 에이전트"></section>
      <div class="gutter" data-resize="sources"></div>
      <section class="col col-sources" id="book-sources" aria-label="작성 기준·원문"></section>
    </main>

    <!-- 데이터 분석 화면 — 1열 결과 파일, 2열 분석 에이전트, 3열 작성 기준·원문(읽기 전용) (FR-WB-088, 106) -->
    <main class="workspace analysis-workspace" id="analysis-workspace" hidden>
      <section class="col col-editor" id="analysis-results" aria-label="결과 파일"></section>
      <div class="gutter" data-resize="chat"></div>
      <section class="col col-chat" id="analysis-chat" aria-label="분석 에이전트"></section>
      <div class="gutter" data-resize="sources"></div>
      <section class="col col-sources" id="analysis-sources" aria-label="작성 기준·원문"></section>
    </main>

    <!-- 양식 화면 — 1열 양식(칸·필드 값), 2열 양식 에이전트, 3열 작성 기준·원문(읽기 전용) (FR-WB-090 ~ 092) -->
    <main class="workspace form-workspace" id="form-workspace" hidden>
      <section class="col col-editor" id="form-editor" aria-label="양식"></section>
      <div class="gutter" data-resize="chat"></div>
      <section class="col col-chat" id="form-chat" aria-label="양식 에이전트"></section>
      <div class="gutter" data-resize="sources"></div>
      <section class="col col-sources" id="form-sources" aria-label="작성 기준·원문"></section>
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
